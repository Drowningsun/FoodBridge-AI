version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: foodbridge-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foodbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodbridge123}
      POSTGRES_DB: ${POSTGRES_DB:-foodbridge_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodbridge"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodbridge-network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: foodbridge-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://foodbridge:foodbridge123@postgres:5432/foodbridge_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - foodbridge-network

  # ML Services
  ml-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: foodbridge-ml
    ports:
      - "8001:8001"
    networks:
      - foodbridge-network

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: foodbridge-web
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_API_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ml-services
    networks:
      - foodbridge-network

volumes:
  postgres_data:

networks:
  foodbridge-network:
    driver: bridge
